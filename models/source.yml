version: 2

sources:
  - name: test_freshness
    database: analytics
    schema: dbt_sprawira_new
    config:
      freshness:
        warn_after: {count: 1, period: day}
        error_after: {count: 2, period: day}
      loaded_at_field: updated_at
    tables:
      - name: source_1_fresh
      - name: source_3_missing          # <-- doesn't exist, will throw query error
      - name: source_2_stale           # <-- exists but is stale
      - name: source_4_fresh           # <-- clone of src_fresh, just to have more "victims"